<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lineage — Family Tree Builder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; overflow: hidden; }
    body { background: var(--th-void); color: var(--th-bone); font-family: 'Crimson Pro', serif; font-size: 15px; }

    :root {
      --th-void:        #18140e;
      --th-abyss:       #201810;
      --th-stone:       #2c2210;
      --th-bone:        #f0e4cc;
      --th-bone-dim:    #c8aa78;
      --th-bone-faint:  #8a7248;
      --th-accent1:     #c9a227;
      --th-accent2:     #e0b840;
      --th-accent-hi:   #f0cc50;
      --th-border:      #3a2e18;
      --th-border2:     #5a4830;
      --th-card:        #241c10;
      --th-card2:       #1c1408;
      --th-panel:       #201810;
      --th-link-active: #e06888;
      --th-link-hover:  #f08898;
      --th-link-bg:     #2a0e18;
    }
    [data-theme="castlevania"] {
      --th-void: #060408; --th-abyss: #0e0820; --th-stone: #1c1640;
      --th-bone: #ede8ff; --th-bone-dim: #b8a8e8; --th-bone-faint: #7868a8;
      --th-accent1: #c070f8; --th-accent2: #70b8f8; --th-accent-hi: #e0a0ff;
      --th-border: #3a2e60; --th-border2: #5a4890;
      --th-card: #1a1440; --th-card2: #100c28; --th-panel: #140e30;
      --th-link-active: #c070f8; --th-link-hover: #e0a0ff; --th-link-bg: #1a0838;
    }
    [data-theme="vampire"] {
      --th-void: #080204; --th-abyss: #120410; --th-stone: #200c14;
      --th-bone: #fff4ec; --th-bone-dim: #e0a888; --th-bone-faint: #a06060;
      --th-accent1: #ff3860; --th-accent2: #f8c848; --th-accent-hi: #ff7090;
      --th-border: #3a1820; --th-border2: #5a2830;
      --th-card: #200c14; --th-card2: #140608; --th-panel: #180810;
      --th-link-active: #ff3860; --th-link-hover: #ff7090; --th-link-bg: #280010;
    }
    [data-theme="dungeon"] {
      --th-void: #060c08; --th-abyss: #0c1410; --th-stone: #141e18;
      --th-bone: #d8f0c8; --th-bone-dim: #98c090; --th-bone-faint: #608868;
      --th-accent1: #48b870; --th-accent2: #90c878; --th-accent-hi: #70d890;
      --th-border: #1e3828; --th-border2: #2e5038;
      --th-card: #101c14; --th-card2: #0a1210; --th-panel: #0e1812;
      --th-link-active: #48b870; --th-link-hover: #70d890; --th-link-bg: #081808;
    }
    [data-theme="escape"] {
      --th-void: #080808; --th-abyss: #101010; --th-stone: #1a1a1a;
      --th-bone: #eeeeee; --th-bone-dim: #c0c0c0; --th-bone-faint: #787878;
      --th-accent1: #d8d8d8; --th-accent2: #f0f0f0; --th-accent-hi: #ffffff;
      --th-border: #2a2a2a; --th-border2: #484848;
      --th-card: #161616; --th-card2: #0e0e0e; --th-panel: #111111;
      --th-link-active: #c8c8c8; --th-link-hover: #eeeeee; --th-link-bg: #1a1a1a;
    }

    ::-webkit-scrollbar { width: 7px; height: 7px; }
    ::-webkit-scrollbar-track { background: var(--th-abyss); }
    ::-webkit-scrollbar-thumb { background: var(--th-border2); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--th-bone-faint); }

    .btn {
      background: var(--th-stone); border: 1px solid var(--th-accent1); color: var(--th-accent-hi);
      padding: 7px 18px; border-radius: 5px; cursor: pointer;
      font-family: 'Crimson Pro', serif; font-size: 14px; font-weight: 600;
      letter-spacing: 0.04em; line-height: 1; transition: all 0.15s;
      white-space: nowrap; display: inline-flex; align-items: center; gap: 5px;
    }
    .btn:hover { background: var(--th-accent1); color: var(--th-void); }
    .btn:active { transform: translateY(1px); }
    .btn.sm  { padding: 5px 13px; font-size: 13px; }
    .btn.xs  { padding: 3px 9px;  font-size: 12px; }
    .btn.danger { border-color: #c04040; color: #f07070; background: var(--th-abyss); }
    .btn.danger:hover { background: #a03030; color: #fff; border-color: #a03030; }
    .btn.ghost { border-color: var(--th-border2); color: var(--th-bone-dim); background: transparent; }
    .btn.ghost:hover { background: var(--th-stone); color: var(--th-bone); border-color: var(--th-accent1); }
    .btn.muted { border-color: var(--th-border); color: var(--th-bone-faint); background: transparent; font-weight: 400; }
    .btn.muted:hover { background: var(--th-stone); color: var(--th-bone-dim); border-color: var(--th-border2); }
    .btn.linking { border-color: var(--th-link-active); color: var(--th-link-hover); background: var(--th-link-bg); }
    .btn.linking:hover { background: var(--th-link-active); color: #fff; }
    .btn.icon { padding: 5px 9px; font-size: 16px; }

    .tab-btn {
      background: none; border: none; border-bottom: 2px solid transparent;
      cursor: pointer; padding: 0 16px; height: 100%;
      font-family: 'Crimson Pro', serif; font-size: 15px; color: var(--th-bone-dim);
      letter-spacing: 0.04em; transition: color 0.15s; white-space: nowrap;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .tab-btn.active { color: var(--th-accent-hi); border-bottom-color: var(--th-accent1); }
    .tab-btn:hover:not(.active) { color: var(--th-bone); }

    input, textarea, select {
      background: var(--th-card2); border: 1px solid var(--th-border2); color: var(--th-bone);
      padding: 9px 13px; border-radius: 5px;
      font-family: 'Crimson Pro', serif; font-size: 15px;
      width: 100%; outline: none; line-height: 1.4; display: block;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input::placeholder, textarea::placeholder { color: var(--th-bone-faint); opacity: 0.8; }
    input:focus, textarea:focus, select:focus {
      border-color: var(--th-accent1); background: var(--th-abyss);
      box-shadow: 0 0 0 3px rgba(201,162,39,0.2);
    }
    select option { background: var(--th-card); color: var(--th-bone); }
    textarea { resize: vertical; min-height: 80px; }

    .field-label {
      font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--th-bone-dim); margin-bottom: 5px; margin-top: 14px; display: block; font-weight: 700;
    }
    .section-title {
      font-family: 'Cinzel Decorative', serif; font-size: 11px;
      letter-spacing: 0.14em; color: var(--th-accent1); text-transform: uppercase;
      margin: 14px 0 8px; display: block;
    }
    .panel-heading { font-family: 'Cinzel Decorative', serif; font-size: 17px; color: var(--th-accent2); letter-spacing: 0.06em; }

    .tag {
      display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 12px;
      font-size: 12px; border: 1px solid; line-height: 1.5; white-space: nowrap;
      font-weight: 600; letter-spacing: 0.02em;
    }

    .char-card {
      background: var(--th-card); border: 1px solid var(--th-border); border-radius: 8px;
      padding: 16px; cursor: pointer; transition: border-color 0.2s, background 0.2s;
      display: flex; flex-direction: column; gap: 6px;
    }
    .char-card:hover { border-color: var(--th-accent1); background: var(--th-abyss); }
    .char-card .card-name { font-family: 'Cinzel Decorative', serif; font-size: 13px; color: var(--th-bone); line-height: 1.3; word-break: break-word; }
    .char-card .card-titles { font-size: 13px; font-style: italic; color: var(--th-bone-dim); }
    .char-card .card-meta   { font-size: 13px; color: var(--th-bone-dim); }
    .char-card .card-faction{ font-size: 12px; color: var(--th-bone-dim); }
    .char-card .card-notes  { font-size: 13px; color: var(--th-bone-dim); font-style: italic; line-height: 1.55; border-top: 1px solid var(--th-border); padding-top: 8px; margin-top: 3px; }
    .char-card .card-actions{ display: flex; gap: 6px; justify-content: flex-end; margin-top: 4px; }

    .rel-row { display: flex; align-items: center; gap: 8px; padding: 9px 10px; border-radius: 6px; border-bottom: 1px solid var(--th-border); transition: background 0.15s; }
    .rel-row:hover { background: var(--th-card); }

    .sidebar-char-header { background: linear-gradient(135deg, var(--th-stone) 0%, var(--th-abyss) 100%); border-bottom: 1px solid var(--th-border2); padding: 15px 16px; }
    .sidebar-body { padding: 14px 16px; overflow-y: auto; flex: 1; font-size: 15px; }

    .divider { border: none; border-top: 1px solid var(--th-border); margin: 12px 0; }

    .toast {
      position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
      background: var(--th-stone); border: 1px solid var(--th-accent1); color: var(--th-accent-hi);
      padding: 10px 24px; border-radius: 22px; font-size: 14px; font-weight: 600;
      animation: toastIn 2.8s forwards; pointer-events: none; z-index: 999;
      white-space: nowrap; box-shadow: 0 4px 24px rgba(0,0,0,0.6); letter-spacing: 0.04em;
    }
    @keyframes toastIn {
      0%   { opacity:0; transform:translateX(-50%) translateY(10px); }
      12%  { opacity:1; transform:translateX(-50%) translateY(0); }
      75%  { opacity:1; }
      100% { opacity:0; transform:translateX(-50%) translateY(-4px); }
    }

    .confirm-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.78); display:flex; align-items:center; justify-content:center; z-index:300; }
    .confirm-box { background:var(--th-card); border:1px solid var(--th-border2); border-radius:10px; padding:28px 28px 22px; width:400px; max-width:92vw; box-shadow:0 20px 60px rgba(0,0,0,0.7); }
    .confirm-title { font-family:'Cinzel Decorative',serif; font-size:15px; color:var(--th-accent-hi); margin-bottom:12px; }
    .confirm-body  { font-size:15px; color:var(--th-bone); line-height:1.65; margin-bottom:24px; }
    .confirm-actions { display:flex; gap:8px; justify-content:flex-end; }

    .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.82); display:flex; align-items:center; justify-content:center; z-index:200; }
    .modal-box { background:var(--th-card); border:1px solid var(--th-border2); border-radius:12px; width:540px; max-width:96vw; max-height:92vh; overflow-y:auto; box-shadow:0 24px 80px rgba(0,0,0,0.8); }
    .modal-header { padding:20px 24px 16px; border-bottom:1px solid var(--th-border); font-family:'Cinzel Decorative',serif; font-size:16px; color:var(--th-accent2); display:flex; align-items:center; justify-content:space-between; background:linear-gradient(135deg, var(--th-stone) 0%, var(--th-card) 100%); }
    .modal-body   { padding:6px 24px 24px; }
    .modal-footer { padding:16px 24px; border-top:1px solid var(--th-border); display:flex; gap:8px; justify-content:flex-end; background:var(--th-card2); }
    .form-section { background:var(--th-card2); border:1px solid var(--th-border); border-radius:8px; padding:14px 16px; margin-top:16px; }
    .form-section-title { font-family:'Cinzel Decorative',serif; font-size:11px; letter-spacing:0.18em; text-transform:uppercase; color:var(--th-accent1); margin-bottom:6px; }
    .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:0 16px; }
    .form-full  { grid-column:1/-1; }

    .ctx-menu { position:fixed; z-index:500; background:var(--th-card); border:1px solid var(--th-border2); border-radius:8px; padding:4px 0; min-width:190px; box-shadow:0 8px 32px rgba(0,0,0,0.75); font-family:'Crimson Pro',serif; animation:ctxIn 0.1s ease-out; }
    @keyframes ctxIn { from{opacity:0;transform:scale(0.95)} to{opacity:1;transform:scale(1)} }
    .ctx-label { font-family:'Cinzel Decorative',serif; font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--th-bone-dim); padding:8px 14px 5px; display:block; }
    .ctx-item  { display:flex; align-items:center; gap:9px; padding:8px 14px; font-size:14px; color:var(--th-bone); cursor:pointer; transition:background 0.1s; white-space:nowrap; background:none; border:none; width:100%; text-align:left; font-family:'Crimson Pro',serif; font-weight:600; }
    .ctx-item:hover { background:var(--th-stone); }
    .ctx-item.danger { color:#f07070; }
    .ctx-item.danger:hover { background:var(--th-abyss); color:#ff9090; }
    .ctx-sep  { border:none; border-top:1px solid var(--th-border); margin:4px 0; }
    .ctx-types{ display:flex; flex-wrap:wrap; gap:5px; padding:6px 10px 8px; }
    .ctx-type-btn { border:1px solid; border-radius:4px; padding:4px 9px; font-size:12px; font-family:'Crimson Pro',serif; font-weight:600; cursor:pointer; transition:all 0.12s; white-space:nowrap; background:transparent; }

    /* Hereditary toggle pill */
    .h-toggle { display:inline-flex; align-items:center; gap:9px; cursor:pointer; padding:8px 12px; border-radius:6px; border:1px solid var(--th-border); background:var(--th-card); transition:border-color 0.15s,background 0.15s; user-select:none; width:100%; }
    .h-toggle:hover { border-color:var(--th-border2); }
    .h-toggle.on  { border-color:var(--th-accent1); background:var(--th-stone); }
    .h-pip { width:34px; height:18px; border-radius:9px; background:var(--th-border2); position:relative; transition:background 0.2s; flex-shrink:0; }
    .h-pip::after { content:''; position:absolute; top:3px; left:3px; width:12px; height:12px; border-radius:50%; background:var(--th-bone-faint); transition:transform 0.2s,background 0.2s; }
    .h-toggle.on .h-pip { background:var(--th-accent1); }
    .h-toggle.on .h-pip::after { transform:translateX(16px); background:var(--th-void); }

    /* Welcome popup */
    .welcome-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.85); display:flex; align-items:center; justify-content:center; z-index:400; animation:fadeIn 0.3s ease; }
    @keyframes fadeIn { from{opacity:0} to{opacity:1} }
    .welcome-box { background:var(--th-card); border:1px solid var(--th-accent1); border-radius:14px; width:460px; max-width:94vw; box-shadow:0 28px 80px rgba(0,0,0,0.85),0 0 40px rgba(201,162,39,0.12); overflow:hidden; }
    .welcome-header { background:linear-gradient(135deg,var(--th-stone) 0%,var(--th-abyss) 100%); padding:28px 28px 20px; border-bottom:1px solid var(--th-border2); text-align:center; }
    .welcome-title { font-family:'Cinzel Decorative',serif; font-size:22px; color:var(--th-accent2); letter-spacing:0.08em; margin-bottom:6px; }
    .welcome-subtitle { font-size:14px; color:var(--th-bone-dim); letter-spacing:0.04em; }
    .welcome-body { padding:24px 28px; line-height:1.75; font-size:15px; color:var(--th-bone); }
    .welcome-body p { margin-bottom:14px; }
    .welcome-body p:last-child { margin-bottom:0; }
    .welcome-kofi { display:flex; align-items:center; gap:12px; background:var(--th-card2); border:1px solid var(--th-border2); border-radius:8px; padding:14px 16px; margin:16px 0 4px; text-decoration:none; transition:border-color 0.15s,background 0.15s; cursor:pointer; }
    .welcome-kofi:hover { border-color:var(--th-accent1); background:var(--th-stone); }
    .welcome-kofi-icon { font-size:26px; flex-shrink:0; }
    .welcome-kofi-text { flex:1; }
    .welcome-kofi-label { font-family:'Cinzel Decorative',serif; font-size:13px; color:var(--th-accent2); letter-spacing:0.06em; margin-bottom:2px; }
    .welcome-kofi-sub { font-size:13px; color:var(--th-bone-dim); }
    .welcome-footer { padding:16px 28px 20px; border-top:1px solid var(--th-border); display:flex; justify-content:center; }

    /* Zoom badge */
    .zoom-badge { position:absolute; bottom:14px; right:16px; background:var(--th-abyss); border:1px solid var(--th-border); color:var(--th-bone-faint); padding:4px 9px; border-radius:5px; font-size:12px; font-family:'Crimson Pro',serif; pointer-events:none; user-select:none; letter-spacing:0.04em; }
    .zoom-badge:hover { pointer-events:auto; }

    /* Dynasty btn */
    .dyn-btn { background:var(--th-card2); border:1px solid var(--th-border2); color:var(--th-accent2); padding:5px 11px; border-radius:6px; cursor:pointer; font-family:'Crimson Pro',serif; font-size:14px; display:inline-flex; align-items:center; gap:5px; transition:all 0.15s; white-space:nowrap; max-width:180px; flex-shrink:0; }
    .dyn-btn:hover { border-color:var(--th-accent1); background:var(--th-stone); }
    .dyn-btn span.name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:130px; font-weight:600; }
    .dyn-btn span.arrow { font-size:10px; opacity:0.6; flex-shrink:0; }

    /* Topbar separator */
    .tb-sep { width:1px; height:26px; background:var(--th-border); flex-shrink:0; margin:0 3px; }

    /* Keyboard hint */
    .kbd { display:inline-block; background:var(--th-stone); border:1px solid var(--th-border2); border-radius:3px; padding:1px 5px; font-size:11px; font-family:monospace; color:var(--th-bone-dim); }
  </style>
</head>
<body>
<div id="root"></div>
<script>
"use strict";
const { useState, useRef, useEffect } = React;
const h = React.createElement;

// ─── Constants ────────────────────────────────────────────────────────────────
const RELATIONSHIP_TYPES = ["Parent","Child","Spouse","Sibling","Adopted","Guardian","Rival","Ally","Enemy","Mentor","Apprentice","Other"];
const SPECIES_PRESETS    = ["Human","Elf","Dwarf","Halfling","Orc","Tiefling","Dragonborn","Gnome","Half-Elf","Undead"];
const STATUS_OPTIONS     = ["Alive","Deceased","Unknown","Missing","Undead","Immortal"];

const THEME_PALETTES = {
  default:    ["#c9a227","#e05c7a","#5ca8d6","#9b6dca","#a3c27b","#cc4444","#f0c060","#d07030","#60a890","#c070a0","#7890c8","#888878"],
  castlevania:["#c070f8","#70b8f8","#f870c0","#a848e8","#60d8f8","#e840a8","#9058d8","#50c8e8","#d870e8","#7838c8","#40b8d8","#c850d0"],
  vampire:    ["#ff3860","#f8c848","#e87898","#d84030","#f8a828","#c83860","#e85878","#d89030","#c85070","#e8a840","#f86878","#b82840"],
  dungeon:    ["#48b870","#90c878","#70d890","#38a858","#c8e870","#50c060","#a8d858","#60c878","#80e858","#40b868","#b8d840","#68d888"],
  escape:     ["#e8e8e8","#b8b8b8","#888888","#d0d0d0","#f0f0f0","#a0a0a0","#c8c8c8","#787878","#e0e0e0","#909090","#d8d8d8","#686868"],
};

const RELATION_COLORS = {
  Parent:"var(--th-accent2)", Child:"var(--th-accent2)", Spouse:"#e87090", Sibling:"#60b8e0",
  Adopted:"#80c870", Guardian:"#80c870", Rival:"#e05050", Ally:"#60b8e0",
  Enemy:"#e05050", Mentor:"#a878e0", Apprentice:"#a878e0", Other:"#a09880"
};

const DISORDER_STATUS        = ["Affected","Carrier","Unaffected","Unknown"];
const DISORDER_STATUS_COLORS = { Affected:"#e05050", Carrier:"#e0a030", Unaffected:"#60b870", Unknown:"#909090" };

// ─── Disorder propagation ─────────────────────────────────────────────────────
// Pure module-level function — no stale closures.
// Walks parent→child in topological order so grandchildren are handled correctly.
// Only propagates disorders where hereditary===true.
// Never overwrites entries with source!=="inherited".
function propagateDisorders(charList, relList) {
  // Build directed parent→child map from Parent rels (r.from=parent, r.to=child)
  const childrenOf = {}, parentOf = {};
  relList.forEach(r => {
    if (r.type !== "Parent") return;
    const p = r.from, c = r.to;
    (childrenOf[p] = childrenOf[p]||[]).includes(c) || childrenOf[p].push(c);
    (parentOf[c]   = parentOf[c]  ||[]).includes(p) || parentOf[c].push(p);
  });

  // Topological BFS — parents always processed before their children
  const allIds   = charList.map(c => c.id);
  const inDeg    = Object.fromEntries(allIds.map(id => [id, (parentOf[id]||[]).length]));
  const queue    = allIds.filter(id => inDeg[id] === 0);
  const order    = [];
  const seen     = new Set();
  while (queue.length) {
    const id = queue.shift();
    if (seen.has(id)) continue;
    seen.add(id); order.push(id);
    (childrenOf[id]||[]).forEach(cid => { if (--inDeg[cid] <= 0 && !seen.has(cid)) queue.push(cid); });
  }
  allIds.forEach(id => { if (!seen.has(id)) order.push(id); }); // cycles safety

  // Deep-copy so React state is never mutated directly
  const cm = Object.fromEntries(charList.map(c => [c.id, {...c, disorders:(c.disorders||[]).map(d=>({...d}))}]));

  order.forEach(childId => {
    const pids = parentOf[childId] || [];
    if (!pids.length) return;

    // Collect all HEREDITARY disorders from parents (already propagated in this pass)
    const fromParents = {}; // name → [statuses from parents]
    pids.forEach(pid => {
      ((cm[pid] && cm[pid].disorders) || []).forEach(d => {
        if (!d.hereditary) return;
        (fromParents[d.name] = fromParents[d.name]||[]).push(d.status);
      });
    });

    const childDis = cm[childId].disorders;

    // Upsert inherited entries
    Object.entries(fromParents).forEach(([name, statuses]) => {
      const existing = childDis.find(d => d.name === name);
      if (existing && existing.source !== "inherited") return; // manual entry — hands off

      // If any parent is Affected or Carrier, child is at-risk → Carrier
      const atRisk = statuses.some(s => s === "Affected" || s === "Carrier");
      const inheritedStatus = atRisk ? "Carrier" : "Unaffected";

      if (existing) {
        existing.status     = inheritedStatus;
        existing.hereditary = true;
      } else {
        childDis.push({ name, hereditary:true, status:inheritedStatus, source:"inherited" });
      }
    });

    // Remove stale inherited entries (disorder no longer hereditary in any parent)
    cm[childId].disorders = childDis.filter(d => d.source !== "inherited" || fromParents[d.name]);
  });

  return Object.values(cm);
}

// ── Dynasty storage ────────────────────────────────────────────────────────────
function loadDynasties() {
  try { var r=localStorage.getItem(DYNASTIES_KEY); if(r) return JSON.parse(r); } catch(e){}
  return null;
}
function saveDynasties(d){ try { localStorage.setItem(DYNASTIES_KEY,JSON.stringify(d)); } catch(e){} }
function getActiveDynastyId(){ try { return localStorage.getItem(ACTIVE_DYN_KEY)||null; } catch(e){ return null; } }
function setActiveDynastyId(id){ try { localStorage.setItem(ACTIVE_DYN_KEY,id); } catch(e){} }

function initDynasties() {
  var existing = loadDynasties();
  if(existing && Object.keys(existing).length) return existing;
  var old = null;
  try { var r=localStorage.getItem(STORAGE_KEY); if(r) old=JSON.parse(r); } catch(e){}
  var firstId = "dyn_"+Date.now();
  var dyns = {};
  dyns[firstId] = {
    id: firstId,
    name: (old && old.treeName) || DEMO.treeName,
    treeName: (old && old.treeName) || DEMO.treeName,
    chars: (old && old.chars) || DEMO.chars,
    rels:  (old && old.rels)  || DEMO.rels
  };
  saveDynasties(dyns);
  setActiveDynastyId(firstId);
  return dyns;
}

// ─── Gender Icon ──────────────────────────────────────────────────────────────
function GenderIcon({gender,x,y,col}) {
  if(!gender) return null;
  const g=gender.toLowerCase().replace(/[\/\|\(\)]/g," ");
  const isMale   = /\bhe\b|\bhim\b|\bhis\b/.test(g)||/\bmale\b|\bman\b|\bmen\b|\bboy\b/.test(g)||/^m$/.test(g.trim());
  const isFemale = /\bshe\b|\bher\b|\bhers\b/.test(g)||/\bfemale\b|\bwoman\b|\bgirl\b/.test(g)||/^f$/.test(g.trim());
  const isNb     = /\bthey\b|\bthem\b/.test(g)||/\bnon.?bin/.test(g)||/\benby\b/.test(g);
  if(!isMale&&!isFemale&&!isNb) return null;
  const r=4,sw=1.4,st={pointerEvents:"none",userSelect:"none"};
  if(isMale) return h("g",{style:st},
    h("circle",{cx:x,cy:y+1,r,fill:"none",stroke:col,strokeWidth:sw}),
    h("line",{x1:x+r*.7,y1:y+1-r*.7,x2:x+r*1.7,y2:y+1-r*1.7,stroke:col,strokeWidth:sw}),
    h("polyline",{points:(x+r*1.1)+","+(y+1-r*1.7)+" "+(x+r*1.7)+","+(y+1-r*1.7)+" "+(x+r*1.7)+","+(y+1-r*1.1),fill:"none",stroke:col,strokeWidth:sw,strokeLinejoin:"round"}));
  if(isFemale) return h("g",{style:st},
    h("circle",{cx:x,cy:y-1,r,fill:"none",stroke:col,strokeWidth:sw}),
    h("line",{x1:x,y1:y-1+r,x2:x,y2:y-1+r+4,stroke:col,strokeWidth:sw}),
    h("line",{x1:x-2.5,y1:y-1+r+2.5,x2:x+2.5,y2:y-1+r+2.5,stroke:col,strokeWidth:sw}));
  return h("g",{style:st},
    h("circle",{cx:x,cy:y,r:r-.5,fill:"none",stroke:col,strokeWidth:sw}),
    h("line",{x1:x,y1:y-r+.5,x2:x,y2:y-r-3,stroke:col,strokeWidth:sw}),
    h("line",{x1:x-2,y1:y-r-1.5,x2:x+2,y2:y-r-1.5,stroke:col,strokeWidth:sw}),
    h("line",{x1:x,y1:y+r-.5,x2:x,y2:y+r+3,stroke:col,strokeWidth:sw}),
    h("line",{x1:x-2,y1:y+r+1.5,x2:x+2,y2:y+r+1.5,stroke:col,strokeWidth:sw}));
}

// ─── SVG CharNode ─────────────────────────────────────────────────────────────
function CharNode({c,selected,linking,onMouseDown,onDoubleClick,onContextMenu}) {
  const isSel=selected===c.id, isLnk=linking===c.id, cx=NODE_W/2;
  const rows=[];
  if(c.titles) rows.push({text:trunc(c.titles,22),color:c.color,size:11,italic:true});
  const sa=[c.species,c.age?"Age "+c.age:""].filter(Boolean).join(" "+dot+" ");
  if(sa) rows.push({text:trunc(sa,22),color:"var(--th-bone-dim)",size:11});
  if(c.role)    rows.push({text:trunc(c.role,22),   color:"var(--th-accent2)",  size:11,italic:true});
  if(c.faction) rows.push({text:trunc(c.faction,22),color:"var(--th-bone-dim)", size:11});
  const sp=(NODE_H-HEADER_H)/(rows.length+1);
  const ch=[];
  if(isSel||isLnk) ch.push(h("rect",{key:"ring",x:-4,y:-4,width:NODE_W+8,height:NODE_H+8,rx:NODE_RX+3,fill:"none",stroke:isLnk?"var(--th-link-hover)":"var(--th-accent2)",strokeWidth:3,filter:"url(#glow)"}));
  ch.push(h("rect",{key:"bg",width:NODE_W,height:NODE_H,rx:NODE_RX,fill:"var(--th-card)",stroke:c.color,strokeWidth:isSel?2:1.5,filter:"url(#shadow)"}));
  ch.push(h("rect",{key:"hd",width:NODE_W,height:HEADER_H,fill:c.color+"42",clipPath:"url(#node-clip)"}));
  ch.push(h("line",{key:"hl",x1:0,y1:HEADER_H,x2:NODE_W,y2:HEADER_H,stroke:c.color+"70",strokeWidth:1}));
  ch.push(h("circle",{key:"cdot",cx:14,cy:HEADER_H/2,r:5,fill:c.color}));
  const sc=statusColor(c.status);
  ch.push(h("circle",{key:"sr",cx:NODE_W-14,cy:HEADER_H/2,r:5.5,fill:"none",stroke:sc,strokeWidth:1.5}));
  ch.push(h("circle",{key:"sd",cx:NODE_W-14,cy:HEADER_H/2,r:3,fill:sc}));
  ch.push(h(GenderIcon,{key:"gi",gender:c.gender,x:NODE_W-10,y:HEADER_H+11,col:c.color+"aa"}));
  // Disorder badge
  const dis=c.disorders||[];
  if(dis.length>0){
    const dCol=dis.some(d=>d.status==="Affected")?"#e05050":dis.some(d=>d.status==="Carrier")?"#e0a030":"#909090";
    ch.push(h("g",{key:"dbadge",style:{pointerEvents:"none",userSelect:"none"}},
      h("circle",{cx:12,cy:NODE_H-10,r:6,fill:dCol+"33",stroke:dCol,strokeWidth:1.2}),
      h("text",{x:12,y:NODE_H-10,textAnchor:"middle",dominantBaseline:"central",fontSize:8,fill:dCol,fontWeight:"700",fontFamily:"sans-serif"},"⚕")));
  }
  ch.push(h("text",{key:"nm",x:cx,y:HEADER_H/2,textAnchor:"middle",dominantBaseline:"central",fontSize:13,fontWeight:"700",fill:"var(--th-bone)",fontFamily:"'Cinzel Decorative',serif",style:{userSelect:"none",pointerEvents:"none"}},trunc(c.name,15)));
  rows.forEach((row,i)=>ch.push(h("text",{key:"r"+i,x:cx,y:HEADER_H+sp*(i+1),textAnchor:"middle",dominantBaseline:"central",fontSize:row.size,fill:row.color,fontStyle:row.italic?"italic":"normal",fontFamily:"'Crimson Pro',serif",style:{userSelect:"none",pointerEvents:"none"}},row.text)));
  return h("g",{style:{cursor:linking?"crosshair":"grab"},transform:"translate("+c.x+","+c.y+")",
    onMouseDown:e=>onMouseDown(e,c.id),
    onDoubleClick:e=>{e.stopPropagation();onDoubleClick(c);},
    onContextMenu:e=>{e.preventDefault();e.stopPropagation();if(onContextMenu)onContextMenu(e,c);}
  },...ch);
}

                      h("div",{style:{display:"flex",justifyContent:"flex-end",marginTop:4}},
                        h("button",{className:"btn xs ghost",onClick:()=>setEditIdx(null)},"Done")))
                  : h("div",{style:{display:"flex",alignItems:"center",gap:8}},
                      h("div",{style:{flex:1,minWidth:0}},
                        h("div",{style:{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}},
                          h("span",{style:{fontSize:14,color:"var(--th-bone)",fontWeight:600,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}},d.name||"Unnamed"),

// ─── Main App ─────────────────────────────────────────────────────────────────
function App() {
  const [dynasties,setDynastiesState] = useState(()=>initDynasties());
  const [activeDynId,setActiveDynId]  = useState(()=>{
    var id=getActiveDynastyId();
    var d=loadDynasties();
    if(d&&id&&d[id]) return id;
    return d ? Object.keys(d)[0] : null;
  });
  const [showDynPanel,setShowDynPanel] = useState(false);
  const [dynRenameId,setDynRenameId]   = useState(null);
  const [dynRenameVal,setDynRenameVal] = useState("");

  // Helpers to persist dynasty changes
  const saveDyn = (dyns) => { setDynastiesState(dyns); saveDynasties(dyns); };
  const updateActiveDyn = (treeName,chars,rels) => {
    if(!activeDynId) return;
    var next=Object.assign({},dynasties);
    next[activeDynId]=Object.assign({},next[activeDynId],{treeName,chars,rels,name:treeName});
    saveDyn(next);
  };

  const activeDyn = dynasties[activeDynId] || Object.values(dynasties)[0] || {treeName:"",chars:[],rels:[]};

  const [treeName,setTreeName] = useState(activeDyn.treeName || DEMO.treeName);
  const [chars,setChars]       = useState(()=>(activeDyn.chars || DEMO.chars).map(c=>({...c,disorders:c.disorders||[]})));
  const [rels,setRels]         = useState(activeDyn.rels || DEMO.rels);
  const [selected,setSelected] = useState(null);
  const [editingChar,setEditingChar] = useState(null);
  const [dragging,setDragging] = useState(null);
  const [dragOffset,setDragOffset] = useState({x:0,y:0});
  const [linking,setLinking]   = useState(null);
  const [linkType,setLinkType] = useState("Parent");
  const [pan,setPan]           = useState({x:40,y:40});
  const [isPanning,setIsPanning] = useState(false);
  const [panStart,setPanStart] = useState({x:0,y:0});
  const [zoom,setZoom]         = useState(1);
  const [showSidebar,setShowSidebar] = useState(true);
  const [activePanel,setActivePanel] = useState("tree");
  const [editName,setEditName] = useState(false);
  const [toast,setToast]       = useState(null);
  const [confirm,setConfirm]   = useState(null);
  const [contextMenu,setContextMenu] = useState(null);
  const [theme,setTheme]       = useState(()=>localStorage.getItem("lineage_theme")||"default");
  const [preLayoutChars,setPreLayoutChars] = useState(null);
  const [showWelcome,setShowWelcome]       = useState(()=>shouldShowWelcome());

  const svgRef=useRef(null), panRef=useRef(false), toastRef=useRef(null), fileRef=useRef(null);

  // Persist active dynasty whenever tree data changes
  useEffect(()=>{
    if(!activeDynId) return;
    var next=Object.assign({},dynasties);
    next[activeDynId]=Object.assign({},next[activeDynId],{treeName,chars,rels,name:treeName});
    saveDynasties(next);
    setDynastiesState(next);
  },[treeName,chars,rels]);

  useEffect(()=>{ localStorage.setItem("lineage_theme",theme); },[theme]);

  // Switch to a different dynasty
  const switchDynasty = (id) => {
    if(id===activeDynId) return;
    var dyn=dynasties[id];
    if(!dyn) return;
    setActiveDynId(id);
    setActiveDynastyId(id);
    setTreeName(dyn.treeName||dyn.name||"");
    setChars((dyn.chars||[]).map(function(c){return Object.assign({},c,{disorders:c.disorders||[]});}));
    setRels(dyn.rels||[]);
    setSelected(null);
    setLinking(null);
    setPreLayoutChars(null);
    setPan({x:40,y:40});
    setZoom(1);
    setShowDynPanel(false);
    showToast("Switched to "+dyn.name);
  };

  const createDynasty = () => {
    var id="dyn_"+Date.now();
    var next=Object.assign({},dynasties);
    next[id]={id,name:"New Dynasty",treeName:"New Dynasty",chars:[],rels:[]};
    saveDyn(next);
    switchDynasty(id);
  };

  const deleteDynasty = (id) => {
    var keys=Object.keys(dynasties);
    if(keys.length<=1){ showToast("Cannot delete the only dynasty"); return; }
    var next=Object.assign({},dynasties);
    delete next[id];
    saveDyn(next);
    if(id===activeDynId){
      var remaining=Object.keys(next)[0];
      switchDynasty(remaining);
    }
    showToast("Dynasty deleted");
  };

  const renameDynasty = (id,name) => {
    var next=Object.assign({},dynasties);
    next[id]=Object.assign({},next[id],{name:name,treeName:name});
    saveDyn(next);
    if(id===activeDynId) setTreeName(name);
    setDynRenameId(null);
  };

  const exportDynasty = (id) => {
    var dyn=dynasties[id];
    if(!dyn) return;
    var data={treeName:dyn.treeName||dyn.name,chars:dyn.chars||[],rels:dyn.rels||[]};
    var a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));
    a.download=(dyn.name||"dynasty").replace(/\s+/g,"_")+".lineage.json";
    a.click();
    showToast("↓ Exported "+dyn.name);
  };

  const changeTheme = newTheme => {
    if(newTheme===theme) return;
    const all=Object.values(THEME_PALETTES), np=THEME_PALETTES[newTheme]||THEME_PALETTES.default;
    setChars(prev=>prev.map(c=>{
      let idx=-1;
      for(const pal of all){ const i=pal.indexOf(c.color); if(i!==-1){idx=i;break;} }
      return idx===-1?c:{...c,color:np[idx]};
    }));
    setTheme(newTheme);
  };

  const showToast = msg => {
    setToast(null);
    requestAnimationFrame(()=>{ setToast(msg); clearTimeout(toastRef.current); toastRef.current=setTimeout(()=>setToast(null),2800); });
  };

  const askConfirm = (title,msg,fn,confirmLabel) => setConfirm({title,message:msg,onConfirm:fn,confirmLabel:confirmLabel||"Confirm"});
  const getChar    = id => chars.find(c=>c.id===id);

  const addChar = () => {
    const c={id:uid(),name:"New Character",species:"Human",age:"",gender:"",status:"Alive",role:"",notes:"",
      x:200+(chars.length%5)*180,y:120+Math.floor(chars.length/5)*160,
      color:(THEME_PALETTES[theme] && THEME_PALETTES[theme][0]) || "#c9a227",titles:"",faction:"",disorders:[]};
    setChars(p=>[...p,c]); setEditingChar({...c}); setSelected(c.id);
  };

  const saveChar = updated => {
    setChars(prev=>propagateDisorders(prev.map(c=>c.id===updated.id?updated:c), rels));
    setEditingChar(null); showToast("✓ Character saved");
  };

  const deleteChar = id => askConfirm("Delete Character",
    "This will also remove all relationships involving this character. This cannot be undone.",
    ()=>{
      const nr=rels.filter(r=>r.from!==id&&r.to!==id);
      setChars(prev=>propagateDisorders(prev.filter(c=>c.id!==id),nr));
      setRels(nr);
      if(selected===id) setSelected(null);
      setEditingChar(null); setConfirm(null); showToast("Character deleted");
    }, "Delete");

  const addRel = (fromId,toId,type) => {
    // Normalize: "Child" means fromId is the child, toId is the parent — flip to store as Parent
    var actualFrom=fromId, actualTo=toId, actualType=type;
    if(type==="Child"){ actualFrom=toId; actualTo=fromId; actualType="Parent"; }

    if(rels.find(r=>(r.from===actualFrom&&r.to===actualTo)||(r.from===actualTo&&r.to===actualFrom))) return;
    if(actualFrom===actualTo) return;
    const nr=[...rels,{id:"r_"+Date.now(),from:actualFrom,to:actualTo,type:actualType}];
    setRels(nr);
    setChars(prev=>{
      let next=prev;
      if(actualType==="Spouse"||actualType==="Partner"){
        const a=prev.find(c=>c.id===actualFrom),b=prev.find(c=>c.id===actualTo);
        if(a&&b&&(Math.abs(a.y-b.y)>=NODE_H*.6||Math.abs(a.x-b.x)<=NODE_W+20)){
          const midY=(a.y+b.y)/2,[left,right]=a.x<=b.x?[a,b]:[b,a];
          next=prev.map(c=>c.id===left.id?{...c,y:midY}:c.id===right.id?{...c,x:left.x+NODE_W+40,y:midY}:c);
        }
      }
      return actualType==="Parent"?propagateDisorders(next,nr):next;
    });
    showToast(type+" link added");
  };

  const deleteRel = id => {
    const nr=rels.filter(r=>r.id!==id), found=rels.find(r=>r.id===id), wasParent=found && found.type==="Parent";
    setRels(nr);
    if(wasParent) setChars(prev=>propagateDisorders(prev,nr));
    showToast("Link removed");
  };

  const changeRelType = (id,newType) => {
    const old=rels.find(r=>r.id===id);
    // If changing to Child, flip the direction and store as Parent
    var nr;
    if(newType==="Child"){
      nr=rels.map(r=>r.id===id?{...r,from:r.to,to:r.from,type:"Parent"}:r);
    } else {
      nr=rels.map(r=>r.id===id?{...r,type:newType}:r);
    }
    setRels(nr);
    if(old&&(old.type==="Parent"||newType==="Parent"||newType==="Child")) setChars(prev=>propagateDisorders(prev,nr));
    showToast("Link changed to "+newType);
  };

  const exportJSON = () => {
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([JSON.stringify({treeName,chars,rels},null,2)],{type:"application/json"}));
    a.download=treeName.replace(/\s+/g,"_")+".lineage.json"; a.click(); showToast("↓ Exported");
  };

  const importJSON = e => {
    const file=e.target.files[0]; if(!file) return;
    const r=new FileReader();
    r.onload=ev=>{
      try{
        var d=JSON.parse(ev.target.result);
        if(d.chars&&d.rels){
          // Import as a brand new dynasty
          var id="dyn_"+Date.now();
          var name=d.treeName||"Imported Dynasty";
          var next=Object.assign({},dynasties);
          next[id]={id,name,treeName:name,chars:d.chars,rels:d.rels};
          saveDyn(next);
          // Switch to it
          setActiveDynId(id);
          setActiveDynastyId(id);
          setTreeName(name);
          setChars(d.chars.map(function(c){return Object.assign({},c,{disorders:c.disorders||[]});}));
          setRels(d.rels);
          setSelected(null);
          setPreLayoutChars(null);
          setPan({x:40,y:40});
          setZoom(1);
          showToast("↑ Imported as new dynasty");
        }
      }catch(err){showToast("Import failed");}
    };
    r.readAsText(file); e.target.value="";
  };

  const clearAll = () => askConfirm("Clear All","Remove all characters and relationships?",()=>{
    setChars([]); setRels([]); setSelected(null); setConfirm(null); showToast("Cleared");
  }, "Clear All");

  const autoLayout = () => {
    if(!chars.length) return;

    var GAP   = 40;
    var YS    = NODE_H + 90;
    var SG    = NODE_W + 36;
    var SGAP  = 14;

    // ── Build maps ────────────────────────────────────────────────────────────
    var parentOf={}, childrenOf={}, spouseOf={};
    rels.forEach(function(r){
      if(r.type==="Parent"){
        (parentOf[r.to]     = parentOf[r.to]    ||[]).push(r.from);
        (childrenOf[r.from] = childrenOf[r.from] ||[]).push(r.to);
      }
      if(r.type==="Spouse"||r.type==="Partner"){
        (spouseOf[r.from] = spouseOf[r.from]||[]).push(r.to);
        (spouseOf[r.to]   = spouseOf[r.to]  ||[]).push(r.from);
      }
    });
    Object.keys(childrenOf).forEach(function(id){
      childrenOf[id]=childrenOf[id].filter(function(v,i,a){return a.indexOf(v)===i;});
    });

    // ── Build unit list ───────────────────────────────────────────────────────
    // A "unit" is what occupies one slot in a row:
    //   couple  : two spouse-linked chars side by side
    //   cluster : siblings with same parents, no spouse of their own
    //   solo    : unconnected char

    var units = [];       // [{type, members:[], depth, childUnitIds:[]}]
    var unitOf = {};      // charId → unitIndex (primary unit for layout)
    var inUnit = {};      // charId → [unitIndices]

    // One unit per spouse edge
    var edgeSeen={};
    rels.forEach(function(r){
      if(r.type!=="Spouse"&&r.type!=="Partner") return;
      var key=r.from<r.to?r.from+"|"+r.to:r.to+"|"+r.from;
      if(edgeSeen[key]) return; edgeSeen[key]=true;
      var ui=units.length;
      units.push({type:"couple",members:[r.from,r.to],depth:-1,childUnitIds:[]});
      [r.from,r.to].forEach(function(id){
        (inUnit[id]=inUnit[id]||[]).push(ui);
        if(unitOf[id]===undefined) unitOf[id]=ui;
      });
    });

    // Cluster unsponsed children by parent-set
    var clusterKey={};
    chars.forEach(function(c){
      if(inUnit[c.id]&&inUnit[c.id].length) return;
      var parents=(parentOf[c.id]||[]).slice().sort();
      if(!parents.length){
        // solo
        var ui=units.length;
        units.push({type:"solo",members:[c.id],depth:-1,childUnitIds:[]});
        (inUnit[c.id]=inUnit[c.id]||[]).push(ui);
        unitOf[c.id]=ui;
        return;
      }
      var pk=parents.join("|");
      if(clusterKey[pk]!==undefined){
        var ui=clusterKey[pk];
        units[ui].members.push(c.id);
        (inUnit[c.id]=inUnit[c.id]||[]).push(ui);
        unitOf[c.id]=ui;
      } else {
        var ui=units.length;
        clusterKey[pk]=ui;
        units.push({type:"cluster",members:[c.id],depth:-1,childUnitIds:[]});
        (inUnit[c.id]=inUnit[c.id]||[]).push(ui);
        unitOf[c.id]=ui;
      }
    });

    // ── Assign depths ─────────────────────────────────────────────────────────
    units.forEach(function(u,i){
      var hasParent=u.members.some(function(m){return (parentOf[m]||[]).length>0;});
      if(!hasParent) u.depth=0;
    });
    var chg=true,it=0;
    while(chg&&it++<400){
      chg=false;
      units.forEach(function(u,i){
        if(u.depth<0) return;
        u.members.forEach(function(mid){
          (childrenOf[mid]||[]).forEach(function(kid){
            (inUnit[kid]||[]).forEach(function(ci){
              if(ci===i) return;
              if(units[ci].depth<u.depth+1){units[ci].depth=u.depth+1;chg=true;}
            });
          });
        });
      });
    }
    units.forEach(function(u){if(u.depth<0)u.depth=0;});

    // ── Group by depth ────────────────────────────────────────────────────────
    var byDepth={};
    units.forEach(function(u,i){(byDepth[u.depth]=byDepth[u.depth]||[]).push(i);});
    var depths=Object.keys(byDepth).map(Number).sort(function(a,b){return a-b;});

    // ── Unit width ────────────────────────────────────────────────────────────
    function unitW(ui){
      var u=units[ui];
      if(u.type==="couple") return SG+NODE_W;
      if(u.type==="cluster") return u.members.length*NODE_W+(u.members.length-1)*SGAP;
      return NODE_W;
    }

    // ── Subtree width: the width a unit needs including all its descendants ────
    // We compute this bottom-up so parents are always wide enough.
    var subtreeW={};
    depths.slice().reverse().forEach(function(d){
      byDepth[d].forEach(function(ui){
        var u=units[ui];
        // Collect child units (units whose members have this unit's members as parents)
        var childSet={};
        u.members.forEach(function(mid){
          (childrenOf[mid]||[]).forEach(function(kid){
            (inUnit[kid]||[]).forEach(function(ci){
              if(units[ci].depth===u.depth+1) childSet[ci]=true;
            });
          });
        });
        u.childUnitIds=Object.keys(childSet).map(Number);

        var childrenTotalW=0;
        u.childUnitIds.forEach(function(ci,i){
          childrenTotalW+=subtreeW[ci];
          if(i<u.childUnitIds.length-1) childrenTotalW+=GAP;
        });
        subtreeW[ui]=Math.max(unitW(ui), childrenTotalW);
      });
    });

    // ── Top-down placement ────────────────────────────────────────────────────
    var pos={};   // charId → {x,y}
    var unitCX={};// unitIndex → centreX

    function placeUnit(ui, cx, y){
      unitCX[ui]=cx;
      var u=units[ui];
      var w=unitW(ui);
      if(u.type==="couple"){
        var a=u.members[0], b=u.members[1];
        var aS=spouseOf[a]||[], bS=spouseOf[b]||[];
        var leftId,rightId;
        if(aS.length>1){ var bi=aS.indexOf(b); leftId=(bi%2===0)?b:a; rightId=(bi%2===0)?a:b; }
        else if(bS.length>1){ var ai=bS.indexOf(a); leftId=(ai%2===0)?a:b; rightId=(ai%2===0)?b:a; }
        else { leftId=a; rightId=b; }
        pos[leftId] ={x:cx-w/2,     y:y};
        pos[rightId]={x:cx-w/2+SG,  y:y};
      } else if(u.type==="cluster"){
        var n=u.members.length;
        var tw=n*NODE_W+(n-1)*SGAP;
        u.members.forEach(function(mid,i){ pos[mid]={x:cx-tw/2+i*(NODE_W+SGAP),y:y}; });
      } else {
        pos[u.members[0]]={x:cx-NODE_W/2,y:y};
      }

      // Place children spread evenly beneath this unit
      if(!u.childUnitIds.length) return;
      var totalChildW=0;
      u.childUnitIds.forEach(function(ci,i){
        totalChildW+=subtreeW[ci];
        if(i<u.childUnitIds.length-1) totalChildW+=GAP;
      });
      var childY=y+YS;
      var cursor=cx-totalChildW/2;
      u.childUnitIds.forEach(function(ci){
        var sw=subtreeW[ci];
        placeUnit(ci, cursor+sw/2, childY);
        cursor+=sw+GAP;
      });
    }

    // Place root units
    var rootUnits=byDepth[0]||[];
    var totalRootW=0;
    rootUnits.forEach(function(ui,i){totalRootW+=subtreeW[ui];if(i<rootUnits.length-1)totalRootW+=GAP;});
    var rootCursor=-totalRootW/2;
    rootUnits.forEach(function(ui){
      placeUnit(ui, rootCursor+subtreeW[ui]/2, 0);
      rootCursor+=subtreeW[ui]+GAP;
    });

    // ── Multi-pass overlap resolution ─────────────────────────────────────────
    for(var pass=0;pass<4;pass++){
      depths.forEach(function(d){
        var nodes=[], seen={};
        (byDepth[d]||[]).forEach(function(ui){
          units[ui].members.forEach(function(mid){
            if(pos[mid]&&!seen[mid]){seen[mid]=true;nodes.push(mid);}
          });
        });
        nodes.sort(function(a,b){return pos[a].x-pos[b].x;});
        for(var i=1;i<nodes.length;i++){
          var pn=nodes[i-1],cn=nodes[i];
          var need=pos[pn].x+NODE_W+GAP;
          if(pos[cn].x<need){
            var sh=need-pos[cn].x;
            for(var j=i;j<nodes.length;j++) pos[nodes[j]].x+=sh;
            var cui=unitOf[cn];
            if(cui!==undefined) unitCX[cui]=(unitCX[cui]||0)+sh;
          }
        }
      });
    }

    // ── Bottom-up centering: re-center each parent unit over its children ─────
    // Process from deepest to shallowest so children are already in final position
    depths.slice().reverse().forEach(function(d){
      (byDepth[d]||[]).forEach(function(ui){
        var u=units[ui];
        if(!u.childUnitIds||!u.childUnitIds.length) return;

        // Find leftmost and rightmost child node positions
        var childXs=[];
        u.childUnitIds.forEach(function(ci){
          units[ci].members.forEach(function(mid){
            if(pos[mid]) childXs.push(pos[mid].x+NODE_W/2);
          });
        });
        if(!childXs.length) return;
        var childMidX=(Math.min.apply(null,childXs)+Math.max.apply(null,childXs))/2;

        // Current unit centre
        var memberXs=[];
        u.members.forEach(function(mid){ if(pos[mid]) memberXs.push(pos[mid].x+NODE_W/2); });
        if(!memberXs.length) return;
        var unitMidX=(Math.min.apply(null,memberXs)+Math.max.apply(null,memberXs))/2;

        var shift=childMidX-unitMidX;
        if(Math.abs(shift)<1) return;
        u.members.forEach(function(mid){ if(pos[mid]) pos[mid].x+=shift; });
      });
    });

    // ── After centering, one final overlap resolution pass ────────────────────
    for(var pass2=0;pass2<2;pass2++){
      depths.forEach(function(d){
        var nodes=[], seen={};
        (byDepth[d]||[]).forEach(function(ui){
          units[ui].members.forEach(function(mid){
            if(pos[mid]&&!seen[mid]){seen[mid]=true;nodes.push(mid);}
          });
        });
        nodes.sort(function(a,b){return pos[a].x-pos[b].x;});
        for(var i=1;i<nodes.length;i++){
          var pn=nodes[i-1],cn=nodes[i];
          var need=pos[pn].x+NODE_W+GAP;
          if(pos[cn].x<need){
            var sh=need-pos[cn].x;
            for(var j=i;j<nodes.length;j++) pos[nodes[j]].x+=sh;
          }
        }
      });
    }

    // ── Place any still-unpositioned chars ────────────────────────────────────
    var maxX=0;
    Object.keys(pos).forEach(function(id){maxX=Math.max(maxX,pos[id].x+NODE_W);});
    chars.filter(function(c){return !pos[c.id];}).forEach(function(c,i){
      pos[c.id]={x:maxX+(i+1)*(NODE_W+GAP),y:0};
    });

    // ── Normalise ─────────────────────────────────────────────────────────────
    var minX=Infinity,minY=Infinity;
    Object.keys(pos).forEach(function(id){minX=Math.min(minX,pos[id].x);minY=Math.min(minY,pos[id].y);});
    Object.keys(pos).forEach(function(id){pos[id].x+=60-minX;pos[id].y+=60-minY;});

    setPreLayoutChars(chars.map(function(c){return Object.assign({},c);}));
    setChars(function(p){return p.map(function(c){return pos[c.id]?Object.assign({},c,pos[c.id]):c;});});
    showToast("✦ Tree arranged");
  };

  const confirmAutoLayout = () => {
    askConfirm(
      "Auto-Arrange",
      "All card positions will be reset and rearranged automatically. This cannot be undone except by using the Undo button that appears after arranging.",
      autoLayout,
      "Confirm"
    );
  };

  const undoLayout = () => {
    if(!preLayoutChars) return;
    setChars(preLayoutChars);
    setPreLayoutChars(null);
    showToast("↩ Layout restored");
  };

  const onNodeMouseDown = (e,id) => {
    if(e.button!==0) return; e.stopPropagation();
    if(linking&&linking!==id){ addRel(linking,id,linkType); setLinking(null); return; }
    setSelected(id);
    const c=getChar(id); if(!c) return;
    const sr=svgRef.current.getBoundingClientRect();
    setDragging(id); setDragOffset({x:(e.clientX-sr.left)/zoom-pan.x/zoom-c.x,y:(e.clientY-sr.top)/zoom-pan.y/zoom-c.y});
  };

  const onSvgMouseDown = e => {
    if(e.button!==0) return;
    if(linking){setLinking(null);return;}
    panRef.current=true; setIsPanning(true); setPanStart({x:e.clientX-pan.x,y:e.clientY-pan.y});
  };

  const onMouseMove = e => {
    if(dragging){
      const sr=svgRef.current.getBoundingClientRect();
      var rawX=(e.clientX-sr.left)/zoom-pan.x/zoom-dragOffset.x;
      var rawY=(e.clientY-sr.top)/zoom-pan.y/zoom-dragOffset.y;

      // Snap Y: if within SNAP_Y pixels of another card's Y, snap to it
      var SNAP_Y=18;
      var snapY=rawY;
      var bestDY=SNAP_Y+1;
      chars.forEach(function(c){
        if(c.id===dragging) return;
        var dy=Math.abs(c.y-rawY);
        if(dy<bestDY){ bestDY=dy; snapY=c.y; }
      });

      setChars(function(p){return p.map(function(c){
        return c.id===dragging?Object.assign({},c,{x:rawX,y:snapY}):c;
      });});
    }
    else if(isPanning) setPan({x:e.clientX-panStart.x,y:e.clientY-panStart.y});
  };

  const onMouseUp = () => { setDragging(null); setIsPanning(false); panRef.current=false; };
  const onWheel = e => {
    e.preventDefault();
    // Trackpad pinch or Ctrl+scroll → zoom
    if(e.ctrlKey || e.metaKey){
      var factor = e.deltaY < 0 ? 1.08 : 0.93;
      setZoom(z => Math.min(3, Math.max(0.2, z * factor)));
    } else {
      // Two-finger trackpad pan (or plain scroll wheel pan)
      setPan(function(p){ return {x: p.x - e.deltaX, y: p.y - e.deltaY}; });
    }
  };

  const selectedRels = selected?rels.filter(r=>r.from===selected||r.to===selected):[];
  const selectedChar = selected?getChar(selected):null;

  // ── Relationship lines ─────────────────────────────────────────────────────
  // Parent rels: group children by their parent-set, draw forked lines.
  // All other rels: simple straight lines.
  const relLines = (function(){
    var lines = [];
    var parentCol = RELATION_COLORS["Parent"] || "#a0a0a0";

    // ── Build lookup maps ─────────────────────────────────────────────────────
    // parentChildren[pid] = [childId, ...]
    // childParents[cid]   = [parentId, ...]
    var parentChildren = {}, childParents = {};
    rels.forEach(function(r){
      if(r.type !== "Parent") return;
      (parentChildren[r.from] = parentChildren[r.from]||[]).push(r.to);
      (childParents[r.to]     = childParents[r.to]    ||[]).push(r.from);
    });

    // ── Build one fork group per couple ──────────────────────────────────────
    // We iterate SPOUSE/PARTNER rels directly — one fork per couple.
    // For each couple (A, B): children = those who have BOTH A and B as parents.
    // After processing all couples, any child not yet assigned to a fork gets
    // a solo line from each of their individual parents.

    var forkGroups = []; // [{key, parents:[id,...], children:[id,...]}]
    var childAssigned = {}; // childId → true if covered by a couple-fork

    var seenCouple = {};
    rels.forEach(function(r){
      if(r.type !== "Spouse" && r.type !== "Partner") return;
      var a = r.from, b = r.to;
      var coupleKey = [a,b].sort().join("|");
      if(seenCouple[coupleKey]) return;
      seenCouple[coupleKey] = true;

      // Children of this couple = intersection of a's children and b's children
      var aKids = parentChildren[a] || [];
      var bKids = parentChildren[b] || [];
      var shared = aKids.filter(function(kid){
        return bKids.indexOf(kid) !== -1;
      });

      if(shared.length === 0) {
        // Couple with no shared children — still make a group so couple lines
        // can be drawn if needed, but skip (no parent lines needed)
        return;
      }

      shared.forEach(function(kid){ childAssigned[kid] = true; });
      forkGroups.push({key: "couple|"+coupleKey, parents:[a,b], children:shared});
    });

    // Solo parent lines: any child not covered by a couple fork gets one
    // fork group per individual parent.
    // Group by parent so siblings of the same single parent share a bar.
    var soloGroups = {}; // parentId → [childId, ...]
    Object.keys(childParents).forEach(function(childId){
      if(childAssigned[childId]) return;
      childParents[childId].forEach(function(pid){
        (soloGroups[pid] = soloGroups[pid]||[]).push(childId);
      });
    });
    Object.keys(soloGroups).forEach(function(pid){
      forkGroups.push({key:"solo|"+pid, parents:[pid], children:soloGroups[pid]});
    });

    // ── Draw each fork group ──────────────────────────────────────────────────
    // Layout per couple fork:
    //
    //   Parent A ────┬──── Parent B        ← horizontal connector at parent mid-Y
    //                │                     ← vertical stem from couple midpoint
    //           ─────┴─────                ← horizontal child bar
    //           │         │               ← vertical drops to each child
    //         Child1    Child2
    //
    // This means when Dad has Wife1 (left) and Wife2 (right), his node gets:
    //   a line going LEFT  to Wife1's midpoint  (fork 1)
    //   a line going RIGHT to Wife2's midpoint  (fork 2)
    // These are on opposite sides so they never overlap.

    forkGroups.forEach(function(grp){
      var pNodes = grp.parents.map(function(pid){ return getChar(pid); }).filter(Boolean);
      var cNodes = grp.children.map(function(cid){ return getChar(cid); }).filter(Boolean);
      if(!pNodes.length || !cNodes.length) return;

      var isSel = selected && (
        pNodes.some(function(n){ return n.id===selected; }) ||
        cNodes.some(function(n){ return n.id===selected; })
      );
      var sw = isSel ? 2.5 : 1.5;
      var op = isSel ? 1.0 : 0.6;

      var cTopY    = Math.min.apply(null, cNodes.map(function(n){ return n.y; }));
      var pBottomY = Math.max.apply(null, pNodes.map(function(n){ return n.y+NODE_H; }));

      // Minimum distance each parent drops before bending — keeps forks visually distinct
      var FORK_DROP = 28;

      // Stem X = horizontal midpoint between all parents in this group
      var stemX = pNodes.reduce(function(s,n){ return s+n.x+NODE_W/2; },0) / pNodes.length;

      // stemTopY: the Y level where parent elbows meet the vertical stem.
      // Must be at least FORK_DROP below every parent's bottom edge.
      var stemTopY  = Math.max(pBottomY + FORK_DROP, pBottomY);
      var junctionY = Math.max(stemTopY + 8, stemTopY + (cTopY - stemTopY) * 0.5);

      if(pNodes.length === 2){
        var p0 = pNodes[0], p1 = pNodes[1];
        var p0x = p0.x+NODE_W/2, p0y = p0.y+NODE_H;
        var p1x = p1.x+NODE_W/2, p1y = p1.y+NODE_H;

        // Each parent drops FORK_DROP then elbows horizontally to stemX
        lines.push(h("polyline",{
          key: grp.key+"-p0",
          points: p0x+","+p0y+" "+p0x+","+stemTopY+" "+stemX+","+stemTopY,
          fill:"none", stroke:parentCol, strokeWidth:sw, strokeOpacity:op, strokeLinejoin:"round"
        }));
        lines.push(h("polyline",{
          key: grp.key+"-p1",
          points: p1x+","+p1y+" "+p1x+","+stemTopY+" "+stemX+","+stemTopY,
          fill:"none", stroke:parentCol, strokeWidth:sw, strokeOpacity:op, strokeLinejoin:"round"
        }));

        // Vertical stem from couple midpoint down to child junction
        lines.push(h("line",{
          key: grp.key+"-stem",
          x1:stemX, y1:stemTopY, x2:stemX, y2:junctionY,
          stroke:parentCol, strokeWidth:sw, strokeOpacity:op
        }));

      } else {
        // Solo parent: drop FORK_DROP then straight to junction
        var px = pNodes[0].x+NODE_W/2, py = pNodes[0].y+NODE_H;
        stemTopY = py + FORK_DROP;
        junctionY = Math.max(stemTopY + 8, stemTopY + (cTopY - stemTopY) * 0.5);
        lines.push(h("line",{
          key: grp.key+"-stem",
          x1:px, y1:py, x2:px, y2:junctionY,
          stroke:parentCol, strokeWidth:sw, strokeOpacity:op
        }));
        stemX = px;
      }

      // Horizontal child bar spanning all children (or just the stem point if 1 child)
      var cMidXs = cNodes.map(function(n){ return n.x+NODE_W/2; });
      var barL = Math.min.apply(null, cMidXs.concat([stemX]));
      var barR = Math.max.apply(null, cMidXs.concat([stemX]));
      lines.push(h("line",{
        key: grp.key+"-bar",
        x1:barL, y1:junctionY, x2:barR, y2:junctionY,
        stroke:parentCol, strokeWidth:sw, strokeOpacity:op
      }));

      // Vertical drops from child bar down to each child's top
      cNodes.forEach(function(cn, ci){
        var cx = cn.x+NODE_W/2;
        lines.push(h("line",{
          key: grp.key+"-c"+ci,
          x1:cx, y1:junctionY, x2:cx, y2:cn.y,
          stroke:parentCol, strokeWidth:sw, strokeOpacity:op
        }));
      });
    });

    // ── Non-parent rels: straight lines ───────────────────────────────────────
    rels.forEach(function(r){
      if(r.type==="Parent") return;
      var f=getChar(r.from), t=getChar(r.to);
      if(!f||!t) return;
      var col=RELATION_COLORS[r.type]||"#a0a0a0";
      var isSel=selected&&(f.id===selected||t.id===selected);
      var fx=f.x+NODE_W/2, fy=f.y+NODE_H/2, tx=t.x+NODE_W/2, ty=t.y+NODE_H/2;
      var mx=(fx+tx)/2, my=(fy+ty)/2;
      lines.push(h("g",{key:"r-"+r.id, style:{cursor:"pointer"},
        onClick:function(e){e.stopPropagation();setContextMenu({kind:"rel",x:e.clientX,y:e.clientY,rel:r});}},
        h("line",{x1:fx,y1:fy,x2:tx,y2:ty,stroke:col,
          strokeWidth:isSel?2.5:1.5, strokeOpacity:isSel?1:0.55,
          strokeDasharray:r.type==="Rival"||r.type==="Enemy"?"6,3":undefined}),
        isSel&&h("g",null,
          h("circle",{cx:mx,cy:my,r:8,fill:"var(--th-abyss)",stroke:col,strokeWidth:1.5}),
          h("text",{x:mx,y:my,textAnchor:"middle",dominantBaseline:"central",
            fontSize:11,fill:col,fontWeight:"700",
            style:{userSelect:"none",pointerEvents:"none"}},"✕"))
      ));
    });

    return lines;
  })();

  // ── Generation depths ──────────────────────────────────────────────────────
  // BFS from roots (chars with no parents) — generation 1 at the top
  const genDepths = (function(){
    var parentOf={};
    rels.forEach(function(r){ if(r.type==="Parent")(parentOf[r.to]=parentOf[r.to]||[]).push(r.from); });
    var depths={}, queue=[], visited={};
    chars.forEach(function(c){
      if(!(parentOf[c.id]&&parentOf[c.id].length)){ depths[c.id]=1; queue.push(c.id); }
    });
    while(queue.length){
      var id=queue.shift();
      if(visited[id]) continue;
      visited[id]=true;
      rels.forEach(function(r){
        if(r.type==="Parent"&&r.from===id){
          var child=r.to;
          var d=(depths[id]||1)+1;
          if(!depths[child]||d>depths[child]) depths[child]=d;
          if(!visited[child]) queue.push(child);
        }
      });
    }
    // Any remaining unconnected chars
    chars.forEach(function(c){ if(!depths[c.id]) depths[c.id]=1; });
    return depths;
  })();


  // ── Keyboard shortcuts ─────────────────────────────────────────────────────
  useEffect(function(){
    function onKey(e){
      if(e.key==="Escape"){
        if(linking){ setLinking(null); return; }
        if(showDynPanel){ setShowDynPanel(false); return; }
        if(selected){ setSelected(null); return; }
      }
      if((e.ctrlKey||e.metaKey)&&e.key==="z"&&preLayoutChars){ undoLayout(); return; }
    }
    window.addEventListener("keydown",onKey);
    return function(){ window.removeEventListener("keydown",onKey); };
  },[linking,showDynPanel,selected,preLayoutChars]);

  // ── Dynasty panel ──────────────────────────────────────────────────────────
  const dynastyPanel = showDynPanel && h("div",{
    style:{position:"fixed",top:58,left:16,zIndex:200,background:"var(--th-card)",
      border:"1px solid var(--th-border2)",borderRadius:10,width:300,
      boxShadow:"0 12px 40px rgba(0,0,0,0.7)",overflow:"hidden"}},
    h("div",{style:{padding:"11px 14px 9px",borderBottom:"1px solid var(--th-border)",display:"flex",alignItems:"center",justifyContent:"space-between"}},
      h("span",{style:{fontFamily:"'Cinzel Decorative',serif",fontSize:12,color:"var(--th-accent2)",letterSpacing:"0.08em"}},"Dynasties"),
      h("button",{className:"btn xs ghost",onClick:()=>setShowDynPanel(false)},"✕")),
    h("div",{style:{maxHeight:340,overflowY:"auto"}},
      Object.values(dynasties).map(function(dyn){
        var isActive=dyn.id===activeDynId;
        return h("div",{key:dyn.id,style:{
          padding:"9px 12px",borderBottom:"1px solid var(--th-border)",
          background:isActive?"var(--th-stone)":"transparent",
          display:"flex",alignItems:"center",gap:6}},
          dynRenameId===dyn.id
            ? h("input",{autoFocus:true,value:dynRenameVal,
                onChange:function(e){setDynRenameVal(e.target.value);},
                onKeyDown:function(e){
                  if(e.key==="Enter") renameDynasty(dyn.id,dynRenameVal.trim()||dyn.name);
                  if(e.key==="Escape") setDynRenameId(null);
                },
                onBlur:function(){renameDynasty(dyn.id,dynRenameVal.trim()||dyn.name);},
                style:{flex:1,fontSize:13,padding:"4px 8px"}})
            : h("span",{
                onClick:function(){if(!isActive)switchDynasty(dyn.id);},
                title:isActive?"Current dynasty":"Switch to "+dyn.name,
                style:{flex:1,fontSize:14,color:isActive?"var(--th-accent-hi)":"var(--th-bone)",
                  cursor:isActive?"default":"pointer",fontWeight:isActive?600:400,
                  overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}},
                (isActive?"▶ ":"")+dyn.name+
                ((dyn.chars||[]).length?" · "+(dyn.chars||[]).length+" chars":"")),
          h("button",{className:"btn xs ghost",title:"Rename dynasty",
            onClick:function(){setDynRenameId(dyn.id);setDynRenameVal(dyn.name);}
          },"✎"),
          h("button",{className:"btn xs ghost",title:"Export this dynasty as JSON",
            onClick:function(){exportDynasty(dyn.id);}
          },"↓"),
          Object.keys(dynasties).length>1&&h("button",{className:"btn xs danger",title:"Delete this dynasty",
            onClick:function(){
              askConfirm("Delete Dynasty","Delete \""+dyn.name+"\" and all its characters? This cannot be undone.",
                function(){deleteDynasty(dyn.id);}, "Delete");
            }
          },"✕")
        );
      })),
    h("div",{style:{padding:"10px 12px",borderTop:"1px solid var(--th-border)"}},
      h("button",{className:"btn sm",style:{width:"100%"},onClick:createDynasty},"+ New Dynasty")));

  const topbar=h("div",{style:{background:"var(--th-panel)",borderBottom:"2px solid var(--th-border2)",height:54,flexShrink:0,display:"flex",alignItems:"center",padding:"0 14px",gap:6,minWidth:0}},
    h("span",{style:{fontFamily:"'Cinzel Decorative',serif",fontSize:15,color:"var(--th-accent2)",letterSpacing:"0.08em",flexShrink:0,userSelect:"none",paddingRight:4}},"✦ Lineage"),
    h("div",{className:"tb-sep"}),
    // Dynasty switcher
    h("button",{className:"dyn-btn",onClick:function(){setShowDynPanel(function(v){return !v;});}},
      h("span",{style:{fontSize:11,opacity:0.6,flexShrink:0}},"⊞"),
      h("span",{className:"name"},(dynasties[activeDynId]||{}).name||treeName),
      h("span",{className:"arrow"},"▾")),
    h("div",{className:"tb-sep"}),
    // Tree name editor
    editName
      ? h("input",{value:treeName,onChange:e=>setTreeName(e.target.value),onBlur:()=>setEditName(false),onKeyDown:e=>{if(e.key==="Enter"||e.key==="Escape")setEditName(false);},autoFocus:true,style:{width:160,background:"transparent",border:"none",borderBottom:"2px solid var(--th-accent1)",color:"var(--th-bone)",fontSize:14,padding:"2px 4px",fontFamily:"'Crimson Pro',serif",flexShrink:0}})
      : h("span",{onClick:()=>setEditName(true),title:"Click to rename tree",style:{fontSize:14,color:"var(--th-bone-dim)",cursor:"pointer",flexShrink:0,maxWidth:180,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",borderBottom:"1px dashed var(--th-border2)",paddingBottom:1}},treeName),

      h("div",{style:{fontFamily:"'Cinzel Decorative',serif",fontSize:10,letterSpacing:"0.12em",color:"var(--th-bone-dim)",marginBottom:7,textTransform:"uppercase",opacity:0.7}},"Legend"),
      h("div",{style:{display:"flex",flexWrap:"wrap",gap:4,marginBottom:10}},
        ...[["Parent/Child","var(--th-accent2)"],["Spouse","#e87090"],["Sibling","#60b8e0"],["Rival","#e05050"],["Mentor","#a878e0"]].map(function(pair){
          return h("span",{key:pair[0],className:"tag",style:{borderColor:pair[1],color:pair[1],background:pair[1]+"18",fontSize:11}},pair[0]);
        })),
      h("div",{style:{borderTop:"1px solid var(--th-border)",paddingTop:9,marginTop:2,display:"flex",alignItems:"center",gap:8,cursor:"pointer",opacity:0.65,transition:"opacity 0.15s"},
        onMouseOver:function(e){e.currentTarget.style.opacity="1";},
        onMouseOut:function(e){e.currentTarget.style.opacity="0.65";},
        onClick:function(){setShowWelcome(true);}},
        h("span",{style:{fontSize:16}},"☕"),
        h("div",null,
          h("div",{style:{fontSize:12,fontWeight:600,color:"var(--th-accent2)",letterSpacing:"0.02em"}},"Support this project"),
          h("div",{style:{fontSize:11,color:"var(--th-bone-faint)"}},"Free & solo-developed · Ko-fi coming soon")))));

  return h("div",{"data-theme":theme==="default"?undefined:theme,style:{height:"100vh",display:"flex",flexDirection:"column",overflow:"hidden"}},
    topbar,
    h("div",{style:{flex:1,display:"flex",overflow:"hidden",minHeight:0}},
      activePanel==="tree"          && treePanel,
      activePanel==="characters"    && charsPanel,
      activePanel==="relationships" && relsPanel,
      activePanel==="disorders"     && disordersPanel,
      activePanel==="themes"        && themesPanel,
      sidebar),
    editingChar&&h(EditModal,{char:editingChar,allChars:chars,existingRels:rels,
      palette:THEME_PALETTES[theme]||THEME_PALETTES.default,
      onSave:saveChar,onDelete:deleteChar,onClose:()=>setEditingChar(null),
      onAddRel:addRel,onDeleteRel:deleteRel}),
    contextMenu&&h(ContextMenu,{menu:contextMenu,onClose:()=>setContextMenu(null),
      onChangeRelType:changeRelType,onDeleteRel:deleteRel,onDeleteChar:deleteChar,
      onEditChar:c=>setEditingChar({...c})}),
    confirm&&h(ConfirmDialog,{title:confirm.title,message:confirm.message,confirmLabel:confirm.confirmLabel||"Confirm",
      onConfirm:confirm.onConfirm,onCancel:()=>setConfirm(null)}),
    dynastyPanel,
    showDynPanel&&h("div",{style:{position:"fixed",inset:0,zIndex:199},onClick:()=>setShowDynPanel(false)}),
    showWelcome&&h(WelcomePopup,{onClose:()=>setShowWelcome(false)}),
    toast&&h("div",{key:toast+Date.now(),className:"toast"},toast));
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>
